worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" request_id=$request_id '
        'upstream=$upstream_addr upstream_status=$upstream_status '
        'request_time=$request_time upstream_time=$upstream_response_time';

    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    keepalive_requests 1000;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    map $uri $login_limit_key {
        default "";
        /api/v1/auth/login $binary_remote_addr;
        /api/v1/jury/login $binary_remote_addr;
    }

    map $uri $registration_limit_key {
        default "";
        /api/v1/auth/register $binary_remote_addr;
        /api/v1/jury/register $binary_remote_addr;
    }

    limit_req_zone $login_limit_key zone=login:10m rate=10r/m;
    limit_req_zone $registration_limit_key zone=registration:10m rate=5r/m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream spcase_app {
        zone spcase_app 64k;
        server app:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        server_name _;

        client_max_body_size 1m;
        client_body_timeout 15s;
        client_header_timeout 10s;
        send_timeout 35s;

        limit_req zone=login burst=10 nodelay;
        limit_req zone=registration burst=5 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Request-ID $request_id always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 35s;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        location ~ ^/api/v1(?:/|$) {
            proxy_intercept_errors on;
            error_page 413 = @api_payload_too_large;
            error_page 429 = @api_rate_limited;
            error_page 502 503 504 =503 @api_unavailable;

            proxy_pass http://spcase_app;
        }

        location / {
            return 404;
        }

        location @api_payload_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"INVALID_REQUEST","message":"Request body is too large"}}';
        }

        location @api_rate_limited {
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests"}}';
        }

        location @api_unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Service is temporarily unavailable"}}';
        }
    }
}
