{{define "content"}}
<div x-data="schedulePage" x-init="init()" class="page-shell">
  <header class="max-w-4xl">
    <p class="font-black uppercase text-coral">Не пропусти этап</p>
    <h1 class="section-title mt-3">Расписание</h1>
    <p class="mt-5 text-lg">Все даты приходят с сервера и отображаются в вашем часовом поясе.</p>
  </header>
  <ol class="relative mt-10 border-l-4 border-ink pl-8">
    <template x-for="(event, index) in events" :key="event.id">
      <li class="relative mb-8 last:mb-0">
        <span class="absolute -left-[3.2rem] grid h-9 w-9 place-items-center border-2 border-ink bg-mustard font-black" x-text="index + 1"></span>
        <article class="brutal-card">
          <time class="font-mono text-sm font-black" x-text="formatDate(event.start_time)"></time>
          <h2 class="mt-2 text-2xl font-black uppercase" x-text="event.title"></h2>
          <p class="mt-3" x-text="event.description"></p>
        </article>
      </li>
    </template>
  </ol>
</div>
{{end}}
