name: spcase

x-database-connection: &database-connection
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:?DB_NAME must be set}

x-application-environment: &application-environment
  <<: *database-connection
  DB_USER: ${DB_APP_USER:?DB_APP_USER must be set}
  DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set}
  DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-15s}
  DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-5s}
  PORT: "8000"
  APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  REGISTRATION_DEADLINE: ${REGISTRATION_DEADLINE:?REGISTRATION_DEADLINE must be set}
  SUBMISSION_DEADLINE: ${SUBMISSION_DEADLINE:?SUBMISSION_DEADLINE must be set}
  NO_TEAM_TELEGRAM_URL: ${NO_TEAM_TELEGRAM_URL:?NO_TEAM_TELEGRAM_URL must be set}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
  JURY_REGISTRATION_KEY: ${JURY_REGISTRATION_KEY:?JURY_REGISTRATION_KEY must be set}

x-container-hardening: &container-hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:?DB_MIGRATOR_USER must be set}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD must be set}
      DB_APP_USER: ${DB_APP_USER:?DB_APP_USER must be set}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres-roles.sh:/docker-entrypoint-initdb.d/10-spcase-roles.sh:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

  migrator:
    image: ${SPCASE_MIGRATOR_IMAGE:-spcase-migrator:production}
    build:
      context: .
      target: migrator
    environment:
      <<: *database-connection
      DB_USER: ${DB_MIGRATOR_USER:?DB_MIGRATOR_USER must be set}
      DB_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD must be set}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    user: "65532:65532"
    <<: *container-hardening
    restart: "no"

  app:
    image: ${SPCASE_APP_IMAGE:-spcase:production}
    build:
      context: .
      target: runtime
    environment:
      <<: *application-environment
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - backend
    expose:
      - "8000"
    read_only: true
    user: "65532:65532"
    <<: *container-hardening
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - /app/healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: ${SPCASE_NGINX_IMAGE:-spcase-nginx:production}
    build:
      context: .
      target: nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
      - edge
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    user: "101:101"
    <<: *container-hardening
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:8080/api/v1/health/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
